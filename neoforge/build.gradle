plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
    id 'me.modmuss50.mod-publish-plugin'
}

neoForge {
    version = neoforge_version
    def at = project(':common').file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    runs {
        configureEach {
            systemProperty('neoforge.enabledGameTestNamespaces', mod_id)
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})"
        }
        client { client() }
        clientData {
            clientData()
            programArguments.addAll '--mod', mod_id, '--all',
                '--output', file('src/generated/resources/').absolutePath,
                '--existing', file('src/main/resources/').absolutePath
        }
        serverData {
            serverData()
            programArguments.addAll '--mod', mod_id, '--all',
                '--output', file('src/generated/resources/').absolutePath,
                '--existing', file('src/main/resources/').absolutePath
        }
        server { server() }
    }
    mods {
        "${mod_id}" { sourceSet sourceSets.main }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    maven {
        url = "https://api.modrinth.com/maven"
    }
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com'
    }
}

dependencies {
    compileOnly project(":common")

    compileOnly "mezz.jei:jei-26.3-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-26.3-neoforge-api:${jei_version}"
    runtimeOnly "mezz.jei:jei-26.3-neoforge:${jei_version}"

    // Dev-only: YACL runtime
    runtimeOnly "maven.modrinth:yacl:GL24RgOP"

    // Mod compatibility
    runtimeOnly "maven.modrinth:cloth-config:GchRXPnb"
    runtimeOnly "maven.modrinth:architectury-api:dZ7iNvS4"
    runtimeOnly "maven.modrinth:geckolib:2s1O42FX"
    // Armor of the Ages and Dawn of Time have no 26.3 release yet, dev runtime dependencies removed
    runtimeOnly "maven.modrinth:fusion-connected-textures:zPVqWQrW"
}

publishMods {
    file = jar.archiveFile
    modLoaders.add("neoforge")
}
