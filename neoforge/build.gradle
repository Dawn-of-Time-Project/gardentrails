plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
    id 'me.modmuss50.mod-publish-plugin'
}

neoForge {
    version = neoforge_version
    def at = project(':common').file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    runs {
        configureEach {
            systemProperty('neoforge.enabledGameTestNamespaces', mod_id)
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})"
        }
        client { client() }
        clientData {
            clientData()
            programArguments.addAll '--mod', mod_id, '--all',
                '--output', file('src/generated/resources/').absolutePath,
                '--existing', file('src/main/resources/').absolutePath
        }
        serverData {
            serverData()
            programArguments.addAll '--mod', mod_id, '--all',
                '--output', file('src/generated/resources/').absolutePath,
                '--existing', file('src/main/resources/').absolutePath
        }
        server { server() }
    }
    mods {
        "${mod_id}" { sourceSet sourceSets.main }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    maven {
        url = "https://api.modrinth.com/maven"
    }
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com'
    }
}

dependencies {
    compileOnly project(":common")

    compileOnly "mezz.jei:jei-26.1.2-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-26.1.2-neoforge-api:${jei_version}"
    runtimeOnly "mezz.jei:jei-26.1.2-neoforge:${jei_version}"

    // Dev-only: armoroftheages requires YACL
    runtimeOnly "maven.modrinth:yacl:B1mfgQmD"

    // Mod compatibility
    runtimeOnly "maven.modrinth:cloth-config:TimoYzse"
    runtimeOnly "maven.modrinth:architectury-api:fyNzvIcr"
    runtimeOnly "maven.modrinth:geckolib:xfVfPcoC"
    runtimeOnly "maven.modrinth:armor-of-the-ages:Xqexlxy8"
    // Dawn of Time has no 26.1.2 release yet (latest is 1.21.11), dev runtime dependency removed
    runtimeOnly "maven.modrinth:fusion-connected-textures:8g0jpGRQ"
}

publishMods {
    file = jar.archiveFile
    modLoaders.add("neoforge")
}
