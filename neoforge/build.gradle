plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
    id 'me.modmuss50.mod-publish-plugin'
}

neoForge {
    version = neoforge_version
    def at = project(':common').file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
    runs {
        configureEach {
            systemProperty('neoforge.enabledGameTestNamespaces', mod_id)
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})"
        }
        client { client() }
        clientData {
            clientData()
            programArguments.addAll '--mod', mod_id, '--all',
                '--output', file('src/generated/resources/').absolutePath,
                '--existing', file('src/main/resources/').absolutePath
        }
        serverData {
            serverData()
            programArguments.addAll '--mod', mod_id, '--all',
                '--output', file('src/generated/resources/').absolutePath,
                '--existing', file('src/main/resources/').absolutePath
        }
        server { server() }
    }
    mods {
        "${mod_id}" { sourceSet sourceSets.main }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    maven {
        url = "https://api.modrinth.com/maven"
    }
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com'
    }
}

dependencies {
    compileOnly project(":common")

    compileOnly "mezz.jei:jei-1.21.11-common-api:27.48.0.106"
    compileOnly "mezz.jei:jei-1.21.11-neoforge-api:27.48.0.106"
    runtimeOnly "mezz.jei:jei-1.21.11-neoforge:27.48.0.106"

    // Dev-only: armoroftheages requires YACL
    runtimeOnly "maven.modrinth:yacl:HZs9mrWM"

    // Mod compatibility
    runtimeOnly "maven.modrinth:cloth-config:Wsus0EWg"
    runtimeOnly "maven.modrinth:architectury-api:EvL9NK2R"
    runtimeOnly "maven.modrinth:geckolib:FpONDAt3"
    runtimeOnly "maven.modrinth:armor-of-the-ages:qfrUfbaf"
    runtimeOnly "maven.modrinth:dawn-of-time:H6CluobL"
    runtimeOnly "maven.modrinth:fusion-connected-textures:1.3.16-neoforge-mc1.21.11"
}

publishMods {
    file = jar.archiveFile
    modLoaders.add("neoforge")
}
