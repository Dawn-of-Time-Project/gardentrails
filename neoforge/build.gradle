plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
    id 'me.modmuss50.mod-publish-plugin'
}

neoForge {
    version = neoforge_version
    def at = project(':common').file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
    runs {
        configureEach {
            systemProperty('neoforge.enabledGameTestNamespaces', mod_id)
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})"
        }
        client { client() }
        data {
            data()
            programArguments.addAll '--mod', mod_id, '--all',
                '--output', file('src/generated/resources/').absolutePath,
                '--existing', file('src/main/resources/').absolutePath
        }
        server { server() }
    }
    mods {
        "${mod_id}" { sourceSet sourceSets.main }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    maven {
        url = "https://api.modrinth.com/maven"
    }
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com'
    }
}

dependencies {
    compileOnly project(":common")

    compileOnly "mezz.jei:jei-1.21.1-common-api:19.64.0.454"
    compileOnly "mezz.jei:jei-1.21.1-neoforge-api:19.64.0.454"
    runtimeOnly "mezz.jei:jei-1.21.1-neoforge:19.64.0.454"

    // Dev-only: armoroftheages requires YACL
    runtimeOnly "maven.modrinth:yacl:7TVdVtxF"

    // Mod compatibility
    runtimeOnly "maven.modrinth:cloth-config:izKINKFg"
    runtimeOnly "maven.modrinth:architectury-api:1IiqEQGl"
    runtimeOnly "maven.modrinth:geckolib:Grwn5rUB"
    runtimeOnly "maven.modrinth:lets-do-vinery:DLINXOWN"
    runtimeOnly "maven.modrinth:farmers-delight:XTVZDOol"
    runtimeOnly "maven.modrinth:critters-and-companions:aeDUpTJS"
    runtimeOnly "maven.modrinth:armor-of-the-ages:EvVBQ12Y"
    runtimeOnly "maven.modrinth:dawn-of-time:tr4M1qvF"
    runtimeOnly "maven.modrinth:fusion-connected-textures:AYDaLPK8"

    // Dev-only: biome mods to test plant worldgen in modded biomes
    runtimeOnly "maven.modrinth:terrablender:6e8GCrLb"
    runtimeOnly "maven.modrinth:glitchcore:S2TfWrZR"
    runtimeOnly "maven.modrinth:lithostitched:cZu4cHY3"
    runtimeOnly "maven.modrinth:corgilib:Za7PInLk"
    runtimeOnly "maven.modrinth:biomes-o-plenty:BtZKRp69"
    runtimeOnly "maven.modrinth:regions-unexplored:5A8LFnXX"
    runtimeOnly "maven.modrinth:natures-spirit:9tpL59jN"
}

publishMods {
    file = jar.archiveFile
    modLoaders.add("neoforge")
}
