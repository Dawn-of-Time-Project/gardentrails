plugins {
    id 'multiloader-loader'
    id 'net.fabricmc.fabric-loom'
}
base {
    archivesName = "${mod_name}-fabric-${minecraft_version}"
}

repositories {
    maven {
        name = "QuiltMC"
        url = "https://maven.quiltmc.org/repository/release/"
    }
    maven {
        name = "Terraformers"
        url = "https://maven.terraformersmc.com/"
    }
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    implementation "com.terraformersmc:modmenu:${project.modmenu_version}"
    compileOnly "mezz.jei:jei-26.3-common-api:${jei_version}"
    // Dawn of Time and Fusion are not loaded on Fabric in dev: Fusion cannot access Transformation.decomposed in the Loom dev environment
    runtimeOnly "maven.modrinth:yacl:s9SjoFu1"
    // YACL libs (Modrinth maven does not expose transitive dependencies)
    runtimeOnly "org.quiltmc.parsers:json:0.2.1"
    runtimeOnly "org.quiltmc.parsers:gson:0.2.1"
    implementation group: 'com.google.code.findbugs', name: 'jsr305', version: '3.0.1'
    implementation project(":common")
}

loom {
    if (project(":common").file("src/main/resources/${mod_id}.accesswidener").exists()) {
        accessWidenerPath.set(project(":common").file("src/main/resources/${mod_id}.accesswidener"))
    }
    runs {
        client {
            client()
            setConfigName("Fabric Client")
            ideConfigGenerated(true)
            runDir("run")
        }
        server {
            server()
            setConfigName("Fabric Server")
            ideConfigGenerated(true)
            runDir("run")
        }
    }
}

publishMods {
    file = jar.archiveFile
    modLoaders.addAll("fabric")
}
